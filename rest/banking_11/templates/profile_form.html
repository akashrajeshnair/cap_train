<!DOCTYPE html>
<html>
<head>
    <title>Update Profile</title>
</head>
<body>
    <h1>Update Profile</h1>
    
    <form action="/profile/update" method="POST">
        <label>Account No:</label>
        <input type="text" name="account_no" value="{{ account['account_no'] }}" readonly><br><br>
        
        <label>Name:</label>
        <input type="text" name="name" value="{{ account['name'] }}"><br><br>
        
        <label>Balance:</label>
        <input type="number" step="0.01" name="balance" value="{{ account['balance'] }}"><br><br>
        
        <label>Salary:</label>
        <input type="number" step="0.01" name="salary" value="{{ account['salary'] }}"><br><br>
        
        <label>Aadhar Card No:</label>
        <input type="text" name="aadhar_card_no" value="{{ account['aadhar_card_no'] }}"><br><br>
        
        <label>PAN Card No:</label>
        <input type="text" name="pan_card_no" value="{{ account['pan_card_no'] }}"><br><br>
        
        <label>Phone Number:</label>
        <input type="text" name="phone_number" value="{{ account['phone_number'] }}"><br><br>
        
        <label>Account Type:</label>
        <input type="text" name="account_type" value="{{ account['account_type'] }}"><br><br>
        
        <input type="submit" value="Update">
    </form>
    
    <br>
    <a href="/profile">Cancel</a>
</body>
</html>
