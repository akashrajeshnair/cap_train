<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
</head>
<body>
    <h1>Welcome, {{ username }}!</h1>

    <button onclick="checkLoan()">Check loan eligibility</button>
    <p id="loan-result"></p>

    <br>

    <a href="/profile">View Profile</a>
    <br><br>
    
    <form action="/logout" method="POST">
        <input type="submit" value="Logout">
    </form>

    <script>
        function checkLoan() {
            fetch('/loan')
            .then(response => response.json())
            .then(data => {
                if (data.eligible) {
                    document.getElementById('loan-result').innerText = 'Eligible for loan'
                } else {
                    document.getElementById('loan-result').innerText = 'Not eligible for loan'
                }
            })
        }
    </script>
</body>
</html>
